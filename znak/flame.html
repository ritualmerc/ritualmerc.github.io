<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>МЕРЦ · Пламя</title>
    <style>
      :root {
        color-scheme: light;
        /* Палитра и размеры макета из задания 08; автономные страницы не грузят CSS сайта. */
        --logo-flame: #a82319;
        --logo-ink: #22262b;
        --logo-ribbon: #fff;
        --surface: #fff;
        --soft: #f3f6fb;
        --text: #22262b;
        --muted: #4a5568;
        --line: #d9e0ec;
        --cycle: 6s;
        --gap: 24px;
        --radius: 16px;
        --font: 16px;
        --touch: 44px;
        --chat: 56px;
        --large: 240px;
        --halo: radial-gradient(
          ellipse,
          rgb(168 35 25 / 22%),
          rgb(168 35 25 / 8%) 46%,
          transparent 72%
        );
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--soft);
        color: var(--text);
        font:
          var(--font)/1.5 system-ui,
          sans-serif;
      }
      main {
        max-inline-size: 1440px;
        margin-inline: auto;
        padding: clamp(16px, 3vw, 40px);
      }
      .controls {
        block-size: 60px;
      }
      header {
        margin-block-end: var(--gap);
      }
      h1 {
        font-size: clamp(28px, 4vw, 42px);
        line-height: calc(1em + 8px);
        text-wrap: balance;
        margin-block: 8px 16px;
      }
      h2 {
        font-size: 24px;
        margin-block: 0 8px;
      }
      p {
        margin-block: 8px 16px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--logo-flame);
        outline-offset: 4px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        min-block-size: var(--touch);
      }
      [aria-current] {
        font-weight: 700;
      }
      button {
        min-block-size: var(--touch);
        padding: 8px 16px;
        border: 1px solid var(--muted);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        margin-block-start: 8px;
      }
      .eyebrow,
      .motion-note,
      .background-label {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      .motion-note {
        font-size: 14px;
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gap);
      }
      .description {
        min-block-size: 72px;
      }
      .samples {
        display: grid;
        gap: var(--gap);
      }
      .detail .samples {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .sample {
        padding: var(--gap);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }
      .white {
        background: var(--surface);
      }
      .soft {
        background: var(--soft);
      }
      .background-label {
        margin-block: 0 16px;
        font-size: 14px;
      }
      .large {
        display: grid;
        justify-items: center;
        gap: 16px;
      }
      .large > span:last-child,
      .small {
        font-size: 14px;
        color: var(--muted);
      }
      .small {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-block-start: var(--gap);
      }
      .header-example,
      .chat-example {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        gap: 12px;
      }
      .chat-circle {
        display: grid;
        place-items: center;
        inline-size: var(--chat);
        block-size: var(--chat);
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 0 0 1px var(--line);
      }
      .mark {
        display: inline-grid;
        position: relative;
        flex: none;
        isolation: isolate;
        line-height: 0;
      }
      .mark svg {
        display: block;
        position: relative;
        overflow: visible;
      }
      /* Центр рисунка x=80, центр viewBox x=84: поправка постоянна только внутри круга. */
      .chat-circle .mark {
        transform: translateX(1.333333px);
      }
      .halo {
        position: absolute;
        inset: -8%;
        background: var(--halo);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      .split-dove {
        opacity: 0;
      }
      @media (max-width: 1050px) {
        .comparison {
          grid-template-columns: 1fr;
        }
        .description {
          min-block-size: 0;
        }
        .comparison .samples {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        .detail .samples,
        .comparison .samples {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark :is(.wing, .head, .fl-c, .fl-r, .fl-l, .fl-s) {
          transform: none !important;
        }
        .mark .static-dove {
          opacity: 1 !important;
        }
        .mark :is(.split-dove, .halo) {
          opacity: 0 !important;
        }
      }
    </style>
  </head>

    <script>
      /* global window, document, matchMedia, IntersectionObserver, requestAnimationFrame, cancelAnimationFrame */
      /* Пишем только transform/opacity: CSS-анимация opacity в Chromium меняет
   антиалиасинг белого силуэта даже в кадре покоя из-за отдельного слоя. */
      (() => {
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        const button = document.getElementById('toggle');
        const marks = [...document.querySelectorAll('[data-motion]')].map((element) => ({
          element,
          visible: false,
          elapsed: 0,
          parts: Object.fromEntries(
            [
              'wing',
              'head',
              'static-dove',
              'split-dove',
              'fl-c',
              'fl-r',
              'fl-l',
              'fl-s',
              'halo',
            ].map((name) => [name, element.querySelector(`.${name}`)]),
          ),
        }));
        let paused = false,
          seeking = false,
          raf = 0,
          last = 0,
          painted = 0;
        window.TOTAL = 6000; // Медленный цикл, в рамках брифа задания 08.
        // Косинус даёт нулевую скорость в каждой опорной позе и на стыке петли.
        const pose = (phase, keys) => {
          const end = keys.findIndex(([time]) => time >= phase);
          if (end <= 0) return keys[0][1];
          const [startTime, startValue] = keys[end - 1];
          const [endTime, endValue] = keys[end];
          const easing =
            (1 - Math.cos((Math.PI * (phase - startTime)) / (endTime - startTime))) / 2;
          return startValue + (endValue - startValue) * easing;
        };
        const put = (element, property, value) => {
          if (!element) return;
          if (property === 'transform') {
            if (!value) element.removeAttribute('transform');
            else if (element.getAttribute('transform') !== value)
              element.setAttribute('transform', value);
          } else if (element.style[property] !== value) element.style[property] = value;
        };
        // Голубь: прежние пути в трёх перекрывающихся clipPath, неподвижное тело.
        const wingPoses = [
          [0, 0],
          [0.12, 0],
          [0.38, 1],
          [0.64, -0.5],
          [0.88, 0],
          [1, 0],
        ];
        const headPoses = [
          [0, 0],
          [0.2, 0],
          [0.48, 1],
          [0.68, -0.325],
          [0.86, 0],
          [1, 0],
        ];
        const renderDove = (part, p) => {
          const wing = pose(p, wingPoses),
            head = pose(p, headPoses);
          const moving = wing !== 0 || head !== 0;
          put(part['static-dove'], 'opacity', moving ? '0' : '1');
          put(part['split-dove'], 'opacity', moving ? '1' : '0');
          put(
            part.wing,
            'transform',
            wing
              ? `translate(85 97) scale(${1 - 0.05 * wing} ${1 - 0.03 * wing}) skewX(${-1.2 * wing}) translate(-85 -97)`
              : '',
          );
          put(part.head, 'transform', head ? `rotate(${2 * head} 91 91)` : '');
        };
        // Основания из SVG; амплитуды 1,8–3,5% и ≤0,8°, выбранные для спокойного движения.
        const flames = [
          ['fl-c', 70, 148, 0.32, 0.68, 0.025, 0.8],
          ['fl-r', 85, 164, 0.4, 0.76, 0.018, -0.7],
          ['fl-l', 58, 145, 0.46, 0.78, 0.025, 0.8],
          ['fl-s', 60, 119, 0.35, 0.7, 0.035, -0.6],
        ];
        const renderFlame = (part, p) => {
          for (const [name, x, y, rise, fall, stretch, skew] of flames) {
            const breath = pose(p, [
              [0, 0],
              [rise, 1],
              [fall, -0.4],
              [1, 0],
            ]);
            put(
              part[name],
              'transform',
              breath
                ? `translate(${x} ${y}) scale(1 ${1 + stretch * breath}) skewX(${skew * breath}) translate(${-x} ${-y})`
                : '',
            );
          }
        };
        const render = (mark, ms) => {
          const p = reduced.matches
            ? 0
            : (((ms % window.TOTAL) + window.TOTAL) % window.TOTAL) / window.TOTAL;
          if (mark.element.dataset.motion === 'dove') renderDove(mark.parts, p);
          else if (mark.element.dataset.motion === 'flame') renderFlame(mark.parts, p);
          else
            put(
              mark.parts.halo,
              'opacity',
              String(
                pose(p, [
                  [0, 0],
                  [0.5, 1],
                  [1, 0],
                ]),
              ),
            );
        };
        const running = (mark) =>
          mark.visible && !document.hidden && !reduced.matches && !paused && !seeking;
        const tick = (now) => {
          raf = 0;
          const dt = last ? Math.min(now - last, 100) : 0;
          last = now;
          for (const mark of marks)
            if (running(mark)) mark.elapsed = (mark.elapsed + dt) % window.TOTAL;
          if (now - painted >= 1000 / 30) {
            // 30 кадров/с достаточно для спокойного движения.
            for (const mark of marks) if (running(mark)) render(mark, mark.elapsed);
            painted = now;
          }
          if (marks.some(running)) raf = requestAnimationFrame(tick);
          else last = 0;
        };
        const sync = () => {
          if (reduced.matches)
            for (const mark of marks) {
              mark.elapsed = 0;
              render(mark, 0);
            }
          button.hidden = reduced.matches;
          button.textContent = paused ? 'Продолжить движение' : 'Пауза движения';
          button.setAttribute('aria-pressed', String(paused));
          if (marks.some(running) && !raf) {
            last = 0;
            raf = requestAnimationFrame(tick);
          } else if (!marks.some(running) && raf) {
            cancelAnimationFrame(raf);
            raf = last = 0;
          }
        };
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            for (const entry of entries)
              marks.find((mark) => mark.element === entry.target).visible = entry.isIntersecting;
            sync();
          });
          marks.forEach((mark) => observer.observe(mark.element));
        }
        button.addEventListener('click', () => {
          paused = !paused;
          seeking = false;
          sync();
        });
        document.addEventListener('visibilitychange', () => {
          last = 0;
          sync();
        });
        reduced.addEventListener('change', sync);
        window.seek = (ms) => {
          if (!Number.isFinite(ms)) throw new TypeError('Время кадра должно быть конечным числом');
          seeking = true;
          sync();
          for (const mark of marks) {
            mark.elapsed = ms;
            render(mark, ms);
          }
        };
        window.motionState = () => marks.map(({ elapsed }) => elapsed);
        marks.forEach((mark) => render(mark, 0));
        sync();
      })();
    </script>
